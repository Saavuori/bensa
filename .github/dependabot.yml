version: 2

# Two compose files live here — docker-compose.yml for local development and
# deploy/docker-compose.yml for the host — so the compose entry lists both
# directories. The local one pins redis directly and is worth watching too.
#
# Every entry carries a 3-day cooldown: a version that gets yanked shortly
# after publishing never reaches a PR.

updates:
  # ---- Go backend ----
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, go]
    cooldown:
      default-days: 3
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # ---- Vite frontend ----
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels: [dependencies, frontend]
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # ---- Dockerfile base images ----
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Helsinki
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, docker]
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # ---- compose service images (local + deploy) ----
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Helsinki
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, docker]
    cooldown:
      default-days: 3
    ignore:
      # Our own images are pinned to :latest by design — the host pulls them, so a
      # PR bumping a tag that never moves is pure noise.
      - dependency-name: ghcr.io/saavuori/*
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Helsinki
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, ci]
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
