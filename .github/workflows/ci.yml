name: CI

# The Docker build only runs on pushes to main, so until this existed a pull
# request had no checks at all. Auto-merge needs something to wait for.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

# One run per branch; a new push supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Go backend ────────────────────────────────────────────────────────────
  # `//go:embed all:dist` is satisfied by the committed
  # backend/internal/api/dist/.gitkeep placeholder, so the backend builds on its
  # own without the frontend bundle.
  backend:
    name: go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # ── Vite frontend ─────────────────────────────────────────────────────────
  frontend:
    name: vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Matches the frontend-builder stage in the Dockerfile. Bump both together.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `lint` is oxlint here rather than eslint; same contract either way.
      - name: Lint
        run: npm run lint

      # `tsc -b && vite build` — the typecheck is the half that catches a
      # dependency bump changing types out from under us.
      - name: Build
        run: npm run build
